<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Selbsttest</title>
<!-- Prüft, dass kaputte Sicherungsdateien abgelehnt werden und wann der Bildschirm wach bleibt. Öffnen und Ergebnis lesen. -->
<pre id="aus"></pre>
<script src="js/speicher.js"></script>
<script>
  var T = window.Tafel, fehler = 0, aus = document.getElementById("aus");
  function soll(name, ok) { if (!ok) fehler++; aus.textContent += (ok ? "OK    " : "FEHLER ") + name + "\n"; }
  var w = { id: "w1", typ: "uhr", x: 0, y: 0, b: 400, h: 240, daten: {} };
  var gut = { version: 1, aktiv: "k1", kurse: [{ id: "k1", name: "7b", widgets: [w] }], letzteSicherung: null };
  soll("gültige Sicherung", T.pruefe(gut));
  soll("leere Kursliste abgelehnt", !T.pruefe({ version: 1, kurse: [] }));
  soll("falsche Version abgelehnt", !T.pruefe(Object.assign({}, gut, { version: 2 })));
  soll("Position als Text abgelehnt", !T.pruefe({ version: 1, kurse: [{ id: "k1", name: "7b", widgets: [Object.assign({}, w, { x: "12" })] }] }));
  soll("fehlende Widget-Daten abgelehnt", !T.pruefe({ version: 1, kurse: [{ id: "k1", name: "7b", widgets: [Object.assign({}, w, { daten: null })] }] }));
  soll("null abgelehnt", !T.pruefe(null));

  // Bildschirm wach halten: läuft irgendwo ein Timer oder eine Stoppuhr?
  function mitTimer(daten) { return { kurse: [{ widgets: [w] }, { widgets: [{ typ: "timer", daten: daten }] }] }; }
  soll("kein Timer → nicht wach", !T.laeuftEinTimer(gut, 1000));
  soll("Timer läuft (anderer Kurs) → wach", T.laeuftEinTimer(mitTimer({ modus: "timer", endeUm: 5000, startUm: null }), 1000));
  soll("Timer abgelaufen → nicht wach", !T.laeuftEinTimer(mitTimer({ modus: "timer", endeUm: 500, startUm: null }), 1000));
  soll("Timer pausiert → nicht wach", !T.laeuftEinTimer(mitTimer({ modus: "timer", endeUm: null, startUm: null }), 1000));
  soll("Stoppuhr läuft → wach", T.laeuftEinTimer(mitTimer({ modus: "stoppuhr", endeUm: null, startUm: 900 }), 1000));
  aus.textContent += fehler ? "\n" + fehler + " Fehler" : "\nAlles in Ordnung";
</script>
</html>
