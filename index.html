<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klassenzimmer-Tafel</title>
  <meta name="theme-color" content="#FCF6E9">
  <!-- App fürs iPad: „Teilen → Zum Home-Bildschirm“ -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/app/app-192.png">
  <link rel="apple-touch-icon" href="assets/app/app-180.png">
  <meta name="apple-mobile-web-app-title" content="Tafel">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- ?v=22: bei jeder Änderung hochzählen, damit Browser die neuen Dateien laden -->
  <link rel="preload" href="assets/fonts/source-sans-3-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css?v=22">
  <link rel="stylesheet" href="css/components.css?v=22">
  <link rel="stylesheet" href="css/app.css?v=22">
</head>
<body class="page">

<div class="app">
  <!-- Kopfzeile: Label mit dem Kursnamen (setzt kurse.js) -->
  <div class="header-strip app__strip"><span class="label" id="kurs-label"></span></div>

  <!-- Kurs-Reiter -->
  <nav class="kopf" aria-label="Kurse">
    <div class="reiter-liste" id="reiter-liste" role="tablist" aria-label="Kurse"></div>
    <button type="button" class="btn btn--square" id="knopf-neuer-kurs" title="Neuen Kurs anlegen" aria-label="Neuen Kurs anlegen">+</button>
  </nav>

  <!-- Die Tafel: hier liegen die Widgets -->
  <main class="tafel" id="tafel" role="tabpanel" aria-label="Tafel">
    <p class="tafel__leer callout" id="tafel-leer">Tippe unten auf ein Widget, um es auf die Tafel zu legen.</p>
  </main>

  <!-- Widget-Leiste: Mitte Widgets, rechts Vollbild und Sicherung -->
  <footer class="leiste">
    <div></div>
    <div class="leiste__widgets" id="leiste-widgets" role="group" aria-label="Widget hinzufügen"></div>
    <div class="leiste__extra">
      <button type="button" class="leiste__knopf" id="knopf-vollbild"><img class="pixel" src="assets/icons/vollbild.svg" width="56" height="56" alt=""><span>Vollbild</span></button>
      <button type="button" class="leiste__knopf" id="knopf-sicherung"><img class="pixel" src="assets/icons/speichern.svg" width="56" height="56" alt=""><span>Sicherung</span></button>
    </div>
  </footer>
</div>

<script src="js/speicher.js?v=22"></script>
<script src="js/ui.js?v=22"></script>
<script src="js/ton.js?v=22"></script>
<script src="js/tafel.js?v=22"></script>
<script src="js/kurse.js?v=22"></script>
<script src="js/widgets/stundenplan.js?v=22"></script>
<script src="js/widgets/uhr.js?v=22"></script>
<script src="js/widgets/timer.js?v=22"></script>
<script src="js/widgets/zufall.js?v=22"></script>
<script src="js/widgets/bild.js?v=22"></script>
<script src="js/widgets/text.js?v=22"></script>
<script src="js/widgets/folien.js?v=22"></script>
<script src="assets/teacher/teacher.js?v=22"></script>
<script src="js/widgets/lehrerin.js?v=22"></script>
<script src="js/app.js?v=22"></script>
</body>
</html>
